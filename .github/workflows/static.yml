# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove no-client skip link from the published interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          target = '<button class="linkbtn cl-skip" data-act="pick-client" data-k="">${both("略過，不指定業主 →", "Skip, no client →")}</button>'
          if html.count(target) != 1:
              raise SystemExit(f"Expected 1 no-client skip button, found {html.count(target)}")
          html = html.replace(target, "")
          html = html.replace(
              "尚無業主。按「新增業主」建立第一位業主，或略過直接選擇單位。",
              "尚無業主。請按「新增業主」建立第一位業主。"
          ).replace(
              "No clients yet. Use Add client to save your first one, or skip and choose your party.",
              "No clients yet. Use Add client to create your first client."
          )
          page.write_text(html, encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
